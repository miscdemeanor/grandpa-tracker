name: Update Grandpa Tracker
on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  push:
    branches:
      - main # Runs immediately when you save/push code
  workflow_dispatch: # Adds a manual "Run" button in GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests edge-tts

      - name: Run Script
        env:
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
        run: python tracker.py

      - name: Commit and Push Audio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update flight status audio"
          file_pattern: status.mp3
